<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11132b" />
    <meta name="description" content="Copy playlists between Spotify accounts with Playlist Port." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Playlist Port — Spotify playlist transfer</title>
    <style>
      html,body{margin:0;min-height:100%;background:#0b1022;color:#f8f8ff;font-family:ui-sans-serif,system-ui,sans-serif}
      .startup-panel{box-sizing:border-box;max-width:36rem;margin:12vh auto;padding:2rem;text-align:center;line-height:1.6}
      .startup-panel h1{font-size:2rem;letter-spacing:-.04em}
      .startup-panel p{color:#d4d0e6}
      .startup-panel a{display:inline-block;margin-top:1rem;padding:.7rem 1.2rem;border-radius:.6rem;background:#b8ffcf;color:#123527;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-panel" aria-live="polite">
        <h1>Playlist Port</h1>
        <p>Loading your playlist mover…</p>
        <p>If loading stalls, reload this page or open the link in your browser.</p>
        <a href="/">Reload page</a>
        <noscript><p>Enable JavaScript in your browser to connect Spotify and copy playlists.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
