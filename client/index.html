    <title>Playlist Port — Copy Spotify playlists between accounts</title>
    <style>
      html,body{margin:0;min-height:100%;background:#070a10;color:#f4f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
      body{display:grid;place-items:center}
      .startup-panel{box-sizing:border-box;max-width:34rem;margin:10vh auto;padding:2rem;text-align:center;line-height:1.65}
      .startup-brand{display:inline-flex;align-items:center;gap:.65rem;margin-bottom:1.25rem;font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
      .startup-mark{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.8rem;background:#1ed760;color:#04120a;font-size:1.2rem;font-weight:800}
      .startup-panel h1{margin:0 0 .6rem;font-size:2rem;letter-spacing:-.04em}
      .startup-panel p{margin:.35rem 0;color:#a7b1c2}
      .startup-panel a{display:inline-block;margin-top:1.35rem;padding:.7rem 1.2rem;border-radius:.65rem;background:#1ed760;color:#04120a;font-weight:700;text-decoration:none}
      .startup-panel a:focus-visible{outline:2px solid #f4f7fb;outline-offset:3px}
      .startup-panel noscript p{color:#f6c85f}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-panel">
        <span class="startup-brand"><span class="startup-mark" aria-hidden="true">P</span> playlist<span style="color:#1ed760">port</span></span>
        <h1>Move your playlists.</h1>
        <p>Loading the transfer workspace…</p>
        <p>If loading stalls, reload this page or open the link in your browser.</p>
        <a href="/">Reload page</a>
        <noscript><p>Enable JavaScript in your browser to connect Spotify and copy playlists.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
